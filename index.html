<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DROPWELL</title>
  <meta name="description" content="Drop glyphs. Clear lines. Don't fill the well.">
  <meta name="theme-color" content="#121018">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <header class="brand">
    <h1>DROPWELL</h1>
    <p>Drop glyphs. Clear lines.</p>
  </header>

  <main>
    <div class="game-layout">
      <aside class="side-panel">
        <div>
          <h2>Hold</h2>
          <div class="mini-board"><canvas id="hold" width="160" height="120"></canvas></div>
        </div>
        <div class="stat"><span>Score</span><b data-score>0</b></div>
        <div class="stat"><span>Lines</span><b data-lines>0</b></div>
        <div class="stat"><span>Level</span><b data-level>1</b></div>
        <div class="stat"><span>Best</span><b data-high>0</b></div>
      </aside>

      <div>
        <div class="well-wrap">
          <canvas id="game" width="360" height="720" aria-label="Dropwell playfield"></canvas>
          <div class="overlay" id="overlay">
            <div>
              <h2 id="overlay-title"></h2>
              <p id="overlay-body"></p>
              <button class="btn btn-play" id="start-btn" type="button">Play</button>
            </div>
          </div>
          <div class="toast" id="toast"></div>
        </div>
        <div class="touch-pad">
          <button type="button" data-act="left">Left</button>
          <button type="button" data-act="soft">Soft</button>
          <button type="button" data-act="right">Right</button>
          <button type="button" data-act="hard">Drop</button>
        </div>
      </div>

      <aside class="side-panel">
        <div>
          <h2>Next</h2>
          <div class="mini-board"><canvas data-next width="160" height="110"></canvas></div>
          <div class="mini-board"><canvas data-next width="160" height="110"></canvas></div>
          <div class="mini-board"><canvas data-next width="160" height="110"></canvas></div>
          <div class="mini-board"><canvas data-next width="160" height="110"></canvas></div>
          <div class="mini-board"><canvas data-next width="160" height="110"></canvas></div>
        </div>
      </aside>
    </div>

    <p class="keys">← → move · ↓ soft · Space drop · Z / X rotate · C hold · P pause</p>
  </main>

  <script src="js/game.js"></script>
</body>
</html>
